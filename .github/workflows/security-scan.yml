name: Verify plugin sources

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'pending/**'
      - 'scripts/verify-plugin-sources.py'
      - 'scripts/manifest_validation.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Find changed manifests
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/get-changed-files.sh "$EVENT_NAME" "$BASE_REF" changed_files.txt

      - name: Verify every active source after publication
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify-plugin-sources.py --all

      - name: Verify changed sources before merge
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify-plugin-sources.py changed_files.txt
