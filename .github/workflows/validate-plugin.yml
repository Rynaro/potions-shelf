name: Validate plugin catalog

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'pending/**'
      - 'schema/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline catalog and source verifier tests
        run: |
          python scripts/test-catalog.py
          python -m unittest discover -s scripts/tests -v

      - name: Find changed manifests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/get-changed-files.sh "$EVENT_NAME" "$BASE_REF" changed_files.txt

      - name: Validate every active catalog entry
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            python scripts/validate-manifest.py "$manifest"
          done < <(find plugins -maxdepth 1 -type f -name '*.potion' -print | LC_ALL=C sort)

      - name: Validate dependency graph
        run: python scripts/dependency-resolver.py plugins/

      - name: Generate candidate index and check any edited index
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python scripts/generate-index.py plugins "$RUNNER_TEMP/expected-index.json"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- index.json; then
            echo "Candidate index generated successfully"
            exit 0
          fi
          if ! cmp -s index.json "$RUNNER_TEMP/expected-index.json"; then
            echo "::error file=index.json::Edited index.json does not match the catalog manifests. Generate it with the documented command."
            exit 1
          fi
