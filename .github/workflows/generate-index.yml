name: Publish plugin index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/generate-index.py'
      - 'scripts/manifest_validation.py'
      - 'schema/**'
      - 'requirements.txt'
      - 'index.json'
  workflow_dispatch:

concurrency:
  group: potions-shelf-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate all active entries
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            python scripts/validate-manifest.py "$manifest"
          done < <(find plugins -maxdepth 1 -type f -name '*.potion' -print | LC_ALL=C sort)
          python scripts/dependency-resolver.py plugins/

      - name: Verify all published plugin sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify-plugin-sources.py --all

      - name: Generate and publish current index
        run: |
          set -euo pipefail
          python scripts/generate-index.py plugins index.json
          git add -- index.json
          if git diff --cached --quiet -- index.json; then
            echo "Plugin index is already current"
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update generated plugin index"
          git push origin HEAD:main
