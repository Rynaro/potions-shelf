name: Verify published plugin index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/generate-index.py'
      - 'scripts/manifest_validation.py'
      - 'scripts/verify-plugin-sources.py'
      - 'scripts/source_triage.py'
      - 'schema/**'
      - 'requirements.txt'
      - 'index.json'
  workflow_dispatch:

concurrency:
  group: potions-shelf-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out published catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate all active entries
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            python scripts/validate-manifest.py "$manifest"
          done < <(find plugins -maxdepth 1 -type f -name '*.potion' -print | LC_ALL=C sort)
          python scripts/dependency-resolver.py plugins/

      - name: Verify all published plugin sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify-plugin-sources.py --all --report triage-report.json

      - name: Preserve triage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-triage-${{ github.run_id }}
          path: triage-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify the published index
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-index.py plugins "$RUNNER_TEMP/expected-index.json"
          if ! cmp -s index.json "$RUNNER_TEMP/expected-index.json"; then
            echo "::error file=index.json::Published catalog index is stale. Submit a pull request with the regenerated index."
            exit 1
          fi
